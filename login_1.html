<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPEC SSO — Header 3 แบบ × 5 สี</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fs:16px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:"Kanit",system-ui,sans-serif;background:#1b1b1f;color:#222}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- color themes ---------- */
.t-blue  {--d:#061a3d;--m:#0b2a5b;--l:#1b4b96;--nav:#071d42;--sub:#0a2550;--subh:#12336a;--ac:#f5c451;--ac2:#e0a526;--cream:#f4f7fc;--page:#e9eef6;--lt:#dbe5f5;--ink:#5a6a85;--acd:#a5761a;--line:#d5deec}
.t-red   {--d:#5e0000;--m:#8f0000;--l:#a3111a;--nav:#4a0000;--sub:#5a0000;--subh:#6e0a0a;--ac:#f5c451;--ac2:#d9a53b;--cream:#fbf6ec;--page:#efe9df;--lt:#f3dede;--ink:#7a5a3a;--acd:#9a7426;--line:#e9dcc4}
.t-orange{--d:#6b2504;--m:#b93d0a;--l:#e2580f;--nav:#4f1b03;--sub:#5e2205;--subh:#7a2e08;--ac:#ffe08a;--ac2:#f3c053;--cream:#fff7ee;--page:#f6ece2;--lt:#ffe4cf;--ink:#7d5235;--acd:#a2621c;--line:#f0dcc6}
.t-brown {--d:#2e1a10;--m:#5b3a29;--l:#8a5a3c;--nav:#26150c;--sub:#33200f;--subh:#4a2e1b;--ac:#f0c27a;--ac2:#c8873a;--cream:#f8f1e6;--page:#f1e7d8;--lt:#f3e4cf;--ink:#7a5a3a;--acd:#9a6a2a;--line:#e2cfb3}
/* split-diagonal (D) pairing: stripe/underline accent, right-panel tint, nav text */
.t-blue  {--dac:#f0b429;--dbg:#f3f6fb;--dtx:#1c2a44;--dhi:#0b2a5b}
.t-red   {--dac:#d9a53b;--dbg:#fbf6ec;--dtx:#3a1a14;--dhi:#8f0000}
.t-orange{--dac:#1f4566;--dbg:#fff6ec;--dtx:#3b2416;--dhi:#b93d0a}
.t-green {--dac:#c9a85a;--dbg:#f4f8f1;--dtx:#1c3326;--dhi:#0f5132}
.t-brown {--dac:#d08a3c;--dbg:#f8f1e6;--dtx:#3b2618;--dhi:#5b3a29}
.t-green {--d:#032417;--m:#0f5132;--l:#167a4c;--nav:#03201a;--sub:#06301f;--subh:#0c452c;--ac:#ead08a;--ac2:#c9a85a;--cream:#f4f8f2;--page:#e8efe6;--lt:#d8ecdf;--ink:#4f6a58;--acd:#8a7133;--line:#d6e3d3}

/* ---------- switcher (not part of design) ---------- */
.switch{position:sticky;top:0;z-index:100;background:#1b1b1f;color:#ddd;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #333}
.switch .lbl{font-size:.82rem;color:#9a9aa5;margin:0 2px 0 6px}
.switch button{background:#2a2a30;color:#ddd;border:1px solid #3a3a42;border-radius:999px;padding:6px 13px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.switch button.act{border-color:#7a6430;color:#f5d98a}
.switch button.on{background:#fff;color:#111;border-color:#fff}
.switch .sw{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
.switch .sep{width:1px;height:24px;background:#3a3a42;margin:0 6px}
.switch .desc{flex-basis:100%;font-size:.86rem;color:#a9a9b3;margin-top:2px}
.stage{max-width:1320px;margin:14px auto 40px}
.variant{display:none;background:#e4e4e4;box-shadow:0 4px 20px rgba(0,0,0,.4);overflow:hidden;position:relative;margin-bottom:26px}
.variant.on{display:block}
.vlabel{display:none;background:#26262c;color:#ddd;font-size:.88rem;padding:7px 14px;align-items:center;gap:8px}
.all .vlabel{display:flex}
.vlabel i{width:12px;height:12px;border-radius:50%}
.all .demo{display:none!important}

/* ---------- shared nav ---------- */
.nv{list-style:none;margin:0;padding:0;display:flex}
.nv-item{position:relative}
.nv-link{display:flex;align-items:center;gap:6px;background:none;border:none;color:inherit;white-space:nowrap}
.chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.7;transition:transform .2s}
.nv-item.open .chev{transform:rotate(225deg) translate(-1px,-1px)}
.nv-sub{list-style:none;margin:0;position:absolute;left:0;top:100%;width:max-content;min-width:250px;max-width:380px;opacity:0;visibility:hidden;transform:translateY(6px);transition:.18s;z-index:30}
.nv-item.open>.nv-sub{opacity:1;visibility:visible;transform:none}
.nv-sub a{display:block;line-height:1.4}
.variant .nv>.nv-item:last-child>.nv-sub{left:auto;right:0}
.burger{display:none;background:none;border:none;font-size:1.4rem;width:42px;height:42px;border-radius:10px;color:inherit}
.pop{position:relative}
.pop-menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:#222;border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.2);padding:6px;min-width:140px;display:none;z-index:40}
.pop-menu.open{display:block}
.pop-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;border-radius:7px;font-size:.92rem;color:#222}
.pop-menu button:hover,.pop-menu button.on{background:var(--cream);color:var(--m)}
.fs{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.fs .pm{background:none;border:none;color:inherit;font-weight:600;font-size:1.1rem;width:24px;height:24px;line-height:1;border-radius:6px}
.fs .pm:disabled{opacity:.35;cursor:default}
.lk{background:none;border:none;color:inherit;padding:0}
.logo{display:block;border-radius:50%;flex:none}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
.demo{padding:40px 40px 50px;background:var(--page)}
.demo .crumb{font-size:.9rem;color:var(--ink);margin-bottom:4px}
.demo h2{margin:0 0 12px;font-weight:500;font-size:1.55rem;color:var(--m)}
.demo .card{background:#fff;border-radius:10px;padding:20px 22px;max-width:820px;color:#555;box-shadow:0 1px 3px rgba(0,0,0,.08);line-height:1.7}

/* ======================= A  ROYAL HERITAGE ======================= */
.vA .bar{position:relative;z-index:3;background:linear-gradient(115deg,var(--d) 0%,var(--m) 45%,var(--l) 100%);color:#fff;padding:22px 32px 30px 214px;min-height:118px}
.vA .bar::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23f5c451%22%20stroke-width%3D%221.2%22%3E%3Cpath%20d%3D%22M32%208c6%208%206%2016%200%2024c-6-8-6-16%200-24z%22/%3E%3Cpath%20d%3D%22M32%2032c8-6%2016-6%2024%200c-8%206-16%206-24%200z%22/%3E%3Cpath%20d%3D%22M32%2032c-8-6-16-6-24%200c8%206%2016%206%2024%200z%22/%3E%3Cpath%20d%3D%22M32%2032c6%208%206%2016%200%2024c-6-8-6-16%200-24z%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%223%22/%3E%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%226%22/%3E%3Ccircle%20cx%3D%2264%22%20cy%3D%220%22%20r%3D%226%22/%3E%3Ccircle%20cx%3D%220%22%20cy%3D%2264%22%20r%3D%226%22/%3E%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%226%22/%3E%3C/g%3E%3C/svg%3E");background-size:64px 64px;opacity:.14;pointer-events:none}
.vA .bar::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;z-index:1;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),var(--ac),transparent)}
.vA .bar .logo{--sz:156px;position:absolute;left:36px;bottom:calc(var(--sz) / -2 + 2px);width:var(--sz);height:var(--sz);z-index:6;box-shadow:0 0 0 4px var(--ac2),0 0 0 9px var(--nav),0 0 0 10px var(--ac2),0 10px 26px rgba(0,0,0,.45)}
.vA .ttl{position:relative}
.vA .ttl h1{margin:4px 0 0;font-family:"Noto Serif Thai",serif;font-weight:600;font-size:1.85rem;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.vA .ttl p{margin:6px 0 0;color:var(--ac);font-size:1.05rem;display:flex;align-items:center;gap:10px}
.vA .ttl p::before{content:"";width:28px;height:1px;background:var(--ac)}
.vA .tools{position:absolute;right:28px;top:18px;display:flex;gap:10px;z-index:2}
.vA .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,225,150,.45);color:#fff;border-radius:999px;padding:5px 14px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.vA .chip .pm{color:var(--ac)}
.vA .burger{position:relative;z-index:2}
.vA nav{background:var(--nav);position:relative;z-index:2}
.vA .nv{padding-left:214px}
.vA .nv-link{color:var(--lt);padding:14px 16px;font-size:1rem;position:relative}
.vA .nv-link::after{content:"";position:absolute;left:16px;right:16px;bottom:6px;height:2px;background:var(--ac);transform:scaleX(0);transition:transform .2s}
.vA .nv-item:hover>.nv-link,.vA .nv-item.active>.nv-link,.vA .nv-item.open>.nv-link{color:#fff}
.vA .nv-item:hover>.nv-link::after,.vA .nv-item.active>.nv-link::after,.vA .nv-item.open>.nv-link::after{transform:scaleX(1)}
.vA .nv-sub{background:var(--sub);border-top:2px solid var(--ac2);padding:6px 0;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.vA .nv-sub a{color:var(--lt);padding:10px 20px;font-size:.95rem;border-left:3px solid transparent}
.vA .nv-sub a:hover,.vA .nv-sub a.active{background:var(--subh);color:#fff;border-left-color:var(--ac)}

/* ======================= D  SPLIT DIAGONAL ======================= */
.vD .bar{display:grid;grid-template-columns:auto 1fr;min-height:122px;background:var(--dbg)}
.vD .left{position:relative;background:linear-gradient(135deg,var(--d),var(--l));color:#fff;display:flex;align-items:center;gap:16px;padding:0 92px 0 26px;clip-path:polygon(0 0,100% 0,calc(100% - 56px) 100%,0 100%)}
.vD .left::after{content:"";position:absolute;top:0;bottom:0;right:28px;width:6px;background:var(--dac);transform:skewX(-24.6deg);transform-origin:top}
.vD .logo{width:80px;height:80px;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.vD .ttl h1{margin:0;font-size:1.28rem;font-weight:500;line-height:1.3;white-space:nowrap}
.vD .ttl p{margin:4px 0 0;color:var(--ac);font-size:.98rem}
.vD .right{display:flex;flex-direction:column;justify-content:space-between;padding:10px 20px 0 0;min-width:0}
.vD .util{position:relative;z-index:50;display:flex;justify-content:flex-end;gap:20px;color:color-mix(in srgb,var(--dtx) 85%,var(--dbg));font-size:.86rem;align-items:center}
.vD .util .date{margin-right:auto;padding-left:12px;color:var(--acd)}
.vD .nv{justify-content:flex-end}
.vD .nv-link{padding:14px 10px 16px;font-size:.97rem;color:var(--dtx);border-bottom:3px solid transparent}
.vD .nv-item:hover>.nv-link,.vD .nv-item.open>.nv-link{color:var(--dhi)}
.vD .nv-item.active>.nv-link{color:var(--dhi);font-weight:500;border-bottom-color:var(--dac)}
.vD .nv-sub{background:#fff;border-radius:0 0 10px 10px;border-top:3px solid var(--dac);padding:6px;box-shadow:0 14px 30px rgba(0,0,0,.15)}
.vD .nv-sub a{padding:10px 14px;border-radius:7px;color:#333}
.vD .nv-sub a:hover,.vD .nv-sub a.active{background:var(--dbg);color:var(--dhi)}
.vD .strip{height:4px;background:linear-gradient(90deg,var(--m) 43.3%,var(--dac) 43.3%)}

/* ======================= E  GOLDEN CREST ======================= */
.vE .bar{position:relative;text-align:center;background:radial-gradient(800px 260px at 50% 0,var(--l),var(--d) 70%);color:#fff;padding:26px 20px 18px;overflow:hidden}
.vE .bar::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23f5c451%22%20stroke-width%3D%221.2%22%3E%3Cpath%20d%3D%22M32%208c6%208%206%2016%200%2024c-6-8-6-16%200-24z%22/%3E%3Cpath%20d%3D%22M32%2032c8-6%2016-6%2024%200c-8%206-16%206-24%200z%22/%3E%3Cpath%20d%3D%22M32%2032c-8-6-16-6-24%200c8%206%2016%206%2024%200z%22/%3E%3Cpath%20d%3D%22M32%2032c6%208%206%2016%200%2024c-6-8-6-16%200-24z%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%223%22/%3E%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%226%22/%3E%3Ccircle%20cx%3D%2264%22%20cy%3D%220%22%20r%3D%226%22/%3E%3Ccircle%20cx%3D%220%22%20cy%3D%2264%22%20r%3D%226%22/%3E%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%226%22/%3E%3C/g%3E%3C/svg%3E") center/80px 80px;opacity:.08;pointer-events:none}
.vE .tools{position:absolute;right:24px;top:14px;display:flex;gap:16px;color:var(--ac);font-size:.86rem;z-index:3}
.vE .crest{position:relative;display:inline-flex;align-items:center;gap:20px}
.vE .crest::before,.vE .crest::after{content:"";width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--ac))}
.vE .crest::after{transform:scaleX(-1)}
.vE .logo{width:96px;height:96px;box-shadow:0 0 0 3px var(--ac),0 0 0 8px rgba(255,220,130,.18),0 10px 24px rgba(0,0,0,.4)}
.vE .ttl{position:relative;margin-top:12px}
.vE .ttl h1{margin:0;font-family:"Noto Serif Thai",serif;font-weight:700;font-size:2rem;background:linear-gradient(180deg,#fff6dc,var(--ac) 60%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.vE .ttl p{margin:4px 0 0;color:var(--lt);font-size:1rem;letter-spacing:3px}
.vE .burger{position:relative;z-index:2}
.vE nav{background:var(--nav);border-top:1px solid var(--ac2);border-bottom:1px solid var(--ac2)}
.vE .nv{justify-content:center}
.vE .nv-link{padding:13px 18px;color:var(--ac);font-size:1rem;letter-spacing:.3px}
.vE .nv-item:hover>.nv-link,.vE .nv-item.open>.nv-link{color:#fff;background:rgba(255,220,130,.1)}
.vE .nv-item.active>.nv-link{color:var(--nav);background:linear-gradient(180deg,var(--ac),var(--ac2))}
.vE .nv-sub{background:var(--sub);border:1px solid var(--acd);padding:6px 0;box-shadow:0 14px 30px rgba(0,0,0,.4)}
.vE .nv-sub a{padding:10px 20px;color:var(--ac)}
.vE .nv-sub a:hover,.vE .nv-sub a.active{background:var(--subh);color:#fff}
.vE .demo{display:flex;flex-direction:column;align-items:center;text-align:center}



/* ======================= LOGIN / REGISTER ======================= */
.btn{border:none;border-radius:10px;padding:11px 18px;font-size:1rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn-p{background:var(--m);color:#fff}.btn-p:hover{background:var(--d)}
.btn-o{background:#fff;color:var(--m);border:1.5px solid var(--m)}.btn-o:hover{background:var(--cream)}
.btn-g{background:none;color:var(--m);padding:8px 10px}
.btn-t{background:#fff;color:#222;border:1.5px solid #d9d6d0}.btn-t:hover{background:#f7f5f1;border-color:#bdb8ae}
.btn-t .tid{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#3b6fe0,#5a3fd0);color:#fff;font-size:.72rem;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.tw{position:relative;width:88px;height:88px;margin:4px auto 14px;border-radius:50%;border:4px solid color-mix(in srgb,var(--m) 15%,#fff);border-top-color:var(--m);animation:spin 1.1s linear infinite}
.tw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;animation:spinr 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion:reduce){.tw,.tw span{animation:none}}
.btn[disabled]{opacity:.5;cursor:default}
.fld{margin-bottom:14px;text-align:left}
.fld label{display:block;font-size:.9rem;margin-bottom:5px;color:#333;font-weight:500}
.fld label .req{color:#c0262d}
.fld .in{position:relative}
.fld input,.fld select{width:100%;font:inherit;font-size:.98rem;padding:11px 13px;border:1.5px solid #d9d6d0;border-radius:10px;background:#fff;color:#222;outline:none;transition:.15s}
.fld input:focus,.fld select:focus{border-color:var(--m);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac2) 35%,transparent)}
.fld.bad input,.fld.bad select{border-color:#c0262d}
.fld .err{color:#c0262d;font-size:.83rem;margin-top:4px}
.fld .hint{color:#777;font-size:.82rem;margin-top:4px}
.fld .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#777;font-size:.85rem;padding:4px 6px}
.fld input[type=file]{padding:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row3{display:grid;grid-template-columns:.7fr 1fr 1fr;gap:0 14px}

.home{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:start;max-width:1120px;margin:0 auto;text-align:left}
.welcome{padding-top:26px}
.welcome .kicker{display:inline-block;background:color-mix(in srgb,var(--m) 10%,#fff);color:var(--m);font-size:.82rem;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.welcome h2{font-size:2rem!important;line-height:1.3;margin:0 0 10px!important;color:var(--m)}
.welcome p.lead{color:#555;line-height:1.75;margin:0 0 20px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app{background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04)}
.app i{flex:none;width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;background:color-mix(in srgb,var(--m) 12%,#fff);color:var(--m);font-size:1rem}
.app b{display:block;font-weight:500;font-size:.93rem;color:#222}
.app small{color:#888;font-size:.78rem}
.lcard{background:#fff;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.12);overflow:hidden;border:1px solid rgba(0,0,0,.05)}
.lcard .lh{background:linear-gradient(120deg,var(--d),var(--m) 60%,var(--l));color:#fff;padding:20px 26px 18px;position:relative}
.lcard .lh::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ac2)}
.lcard .lh h3{margin:0;font-size:1.3rem;font-weight:500}
.lcard .lh p{margin:3px 0 0;font-size:.88rem;color:var(--ac)}
.lcard .lb{padding:22px 26px 24px}
.lcard .between,.cw-box .between{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 16px;font-size:.9rem}
.lcard .between label,.cw-box .between label{display:flex;gap:6px;align-items:center;color:#555;cursor:pointer}
.lcard .lnk2,.cw-box .lnk2{color:var(--m);background:none;border:none;padding:0;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.lcard .or,.cw-box .or{display:flex;align-items:center;gap:10px;color:#999;font-size:.85rem;margin:18px 0 14px}
.lcard .or::before,.lcard .or::after,.cw-box .or::before,.cw-box .or::after{content:"";flex:1;height:1px;background:#e6e2dc}
.lcard .newu,.cw-box .newu{text-align:center;color:#555;font-size:.93rem}
.lcard .w100,.cw-box .w100{width:100%}
.alert{border-radius:10px;padding:10px 13px;font-size:.9rem;margin-bottom:14px;line-height:1.55}
.alert.err{background:#fdecec;color:#9b1c22;border:1px solid #f4c7c9}

/* D footer */
.vD .ft{background:var(--dbg);color:var(--dtx)}
.vD .ft-wrap{display:grid;grid-template-columns:auto 1fr}

}

const find=id=>{for(const m of MENU){if(m.id===id)return{item:m};for(const s of m.sub||[])if(s.id===id)return{item:s,parent:m}}const x=EXTRA.find(e=>e.id===id);if(x)return{item:x};return{item:MENU[0]}};
const mobile=()=>matchMedia('(max-width:980px)').matches;
function closeAll(root){root.querySelectorAll('.nv-item.open').forEach(li=>li.classList.remove('open'));}
function buildNav(root){
  const ul=root.querySelector('.js-nav'),p=find(page);ul.innerHTML='';
  MENU.forEach(m=>{
    const li=document.createElement('li');li.className='nv-item'+((m.id===page||p.parent===m)?' active':'');
    if(!m.sub){li.innerHTML=`<a class="nv-link" href="#">${m[lang]}</a>`;li.firstChild.onclick=e=>{e.preventDefault();go(m.id)};}
    else{
      li.innerHTML=`<button class="nv-link">${m[lang]} <span class="chev"></span></button><ul class="nv-sub">${m.sub.map(s=>`<li><a href="#" data-id="${s.id}" class="${s.id===page?'active':''}">${s[lang]}</a></li>`).join('')}</ul>`;
      const b=li.querySelector('button');
      b.onclick=e=>{e.stopPropagation();const o=!mobile()||!li.classList.contains('open');closeAll(root);if(o)li.classList.add('open')};
      li.onmouseenter=()=>{if(!mobile()){closeAll(root);li.classList.add('open')}};
      li.onmouseleave=()=>{if(!mobile())li.classList.remove('open')};
      li.querySelectorAll('.nv-sub a').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.id)});
    }
    ul.appendChild(li);
  });
}
function buildDemo(root){
  root.querySelector('.js-demo').classList.toggle('lg',page==='home');
  if(page!=='register')root.querySelector('.js-demo').classList.remove('rgd');
  if(page==='home'){renderLogin(root);root.querySelectorAll('.js-demo .js-go').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go)});return;}
  if(page==='register'){RG.render(root);return;}
  if(page==='forgot'){renderForgot(root);root.querySelectorAll('.js-demo .js-go').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go)});return;}
  return buildDemo0(root);}
function buildDemo0(root){const {item,parent}=find(page),t=T[lang];
  root.querySelector('.js-demo').innerHTML=`${page==='home'?'':`<div class="crumb">${t.home}${parent?' / '+parent[lang]:''} / ${item[lang]}</div>`}<h2>${item[lang]}</h2><div class="card">${page==='home'?'':`<b>${t.from}:</b> ${parent?parent[lang]+' → ':''}${item[lang]}<br>`}${t.ph}</div>`;}
function renderAll(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T[lang][el.dataset.i18n]);
  const d=new Date().toLocaleDateString(lang==='th'?'th-TH':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.querySelectorAll('.js-date').forEach(s=>s.textContent=d);
  document.querySelectorAll('.variant').forEach(r=>{buildNav(r);buildDemo(r);buildFoot(r)});
  document.querySelectorAll('.js-lang-menu').forEach(m=>{m.innerHTML=['th','en'].map(l=>`<button data-l="${l}" class="${l===lang?'on':''}">${l==='th'?'ไทย':'English'}</button>`).join('');
    m.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();lang=b.dataset.l;closePops();save();renderAll()})});
}

const QR=(()=>{let r='',seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;

  for(let y=0;y<25;y++)for(let x=0;x<25;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;if(rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;}

    inp=`<select name="${k}"><option value="">${x.choose}</option>${opts.map(o=>`<option value="${E(o[0])}" ${String(d[k])===o[0]?'selected':''}>${E(o[1])}</option>`).join('')}</select>`;}

  else inp=`<input name="${k}" value="${val}">`;

function bindFields(el,onChange){
  el.querySelectorAll('.fld[data-k] input,.fld[data-k] select').forEach(i=>{
    const fl=i.closest('.fld'),k=fl.dataset.k,ev=(i.tagName==='SELECT'||i.type==='file')?'change':'input';
    i.addEventListener(ev,()=>{
      if(i.type==='file'){R.d.file=i.files[0]?i.files[0].name:'';let h=fl.querySelector('.hint');if(!h){h=document.createElement('div');h.className='hint';fl.appendChild(h);}h.textContent=R.d.file?'✓ '+R.d.file:RX[lang].fileH;}
      else R.d[k]=i.value;
      clearErr(fl,k);
      if(k==='pw'){const p=pwOk(i.value),sp=fl.querySelectorAll('.js-rule span');[p.len,p.a,p.n].forEach((v,j)=>sp[j].classList.toggle('ok',v));}
      if(onChange)onChange(k);});});
  const c=el.querySelector('input[name=consent]');
  if(c)c.onchange=()=>{R.d.consent=c.checked;delete R.err.consent;const er=el.querySelector('.cerr');if(er)er.remove();if(onChange)onChange('consent');};
  el.querySelectorAll('.js-policy').forEach(a=>a.onclick=e=>{e.preventDefault();toast(RX[lang].policyToast);});
  el.querySelectorAll('.js-dl').forEach(a=>a.onclick=e=>{e.preventDefault();toast(RX[lang].dlToast);});
  el.querySelectorAll('.js-home').forEach(b=>b.onclick=()=>go('home'));
  el.querySelectorAll('.js-m').forEach(b=>b.onclick=()=>{R.d.method=b.dataset.v;delete R.err.file;renderAll();const nb=document.querySelector('.variant.on .js-m[data-v="'+b.dataset.v+'"]');if(nb)nb.focus({preventScroll:true});});
}
function validate(keys){
  const x=RX[lang],d=R.d,e={};
  keys.forEach(k=>{
    if(k==='method')return;
    if(k==='consent'){if(!d.consent)e.consent=x.needconsent;return;}
    const v=String(d[k]??'').trim();
    if(!v){e[k]=x.req;return;}
    if(k==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))e[k]=x.bademail;
    if(k==='tel'&&!/^0\d{9}$/.test(v))e[k]=x.badtel;
    if(k==='uname'&&!/^[a-z0-9]{6,20}$/i.test(v))e[k]=x.baduname;
    if(k==='pw'){const p=pwOk(d.pw);if(!(p.len&&p.a&&p.n))e[k]=x.badpw;}
    if(k==='pw2'&&d.pw!==d.pw2)e[k]=x.pwmis;
  });return e;
}

function reviewRows(){

  const steps=cen?[[x.sh[0],[]],[x.sh[4],reqKeys('central')]]:[[x.sh[0],[]],[x.sh[1],g?g.applicant:[]],[x.sh[2],g?g.org:[]],[x.sh[3],g?[...g.account,'consent']:[]]];
  const last=steps.length;s.step=Math.min(s.step,last);
  const FOC=(cen?{1:['role'],2:['prov','org']}:{1:['role'],2:['name','pos','email','tel'],3:['org','prov'],4:['uname']})[s.step];
  const stat=()=>R.sent?'sent':inP?'inperson':(R.role&&reqKeys(R.role).every(filled)?'ready':'draft');
  let body='';
  if(s.step===1)body=`<h3>${x.pick}</h3><p class="sub">${x.pickS}</p>${R.err.role?`<div class="alert err">${R.err.role}</div>`:''}<div class="rcs">${Object.keys(ROLES).map(k=>{const r=ROLES[k];return `<button type="button" class="rc js-role ${R.role===k?'on':''}" data-k="${k}"><span class="ri">${r.ic}</span><span><h4>${r[lang]}</h4><p>${lang==='th'?r.dth:r.den}</p><ul>${(lang==='th'?r.lth:r.len).map(l=>`<li>${l}</li>`).join('')}</ul></span><span class="tk">✓</span></button>`}).join('')}</div>`;
  else if(cen)body=`<h3>${x.gForm}</h3><div style="margin-top:16px">${centralBodyHTML()}</div>`;
  else if(s.step===2)body=`<h3>${x.gA}</h3><p class="sub">${x.gAs}</p>${groupHTML('applicant')}`;
  else if(s.step===3)body=`<h3>${x.gO}</h3><p class="sub">${x.gOs}</p>${groupHTML('org')}`;
  else body=`<h3>${x.gC}</h3><p class="sub">${x.gCs}</p>${groupHTML('account')}${consentHTML()}`;
  el.innerHTML=`<div class="r1"><h2 class="r1t">${x.title}</h2>${pvHTML(stat())}
    <section class="fc"><ol class="steps stp">${steps.map((t,i)=>`<li class="${s.step===i+1?'on':i+1<s.step?'passed':''}"><span class="n">${i+1<s.step?'✓':i+1}</span><button type="button" class="js-st" data-i="${i+1}" ${i+1>s.max?'disabled':''}>${t[0]}</button></li>`).join('')}</ol>
    <div class="fb">${body}<div class="acts"><button type="button" class="btn btn-g js-bk" ${s.step===1?'style="visibility:hidden"':''}>← ${x.back}</button><button type="button" class="btn btn-p js-nx">${s.step===last?(cen&&inP?x.homeBtn:'✓ '+x.submit):x.next+' →'}</button></div></div></section></div>`;
  const setStamp=()=>{const st=el.querySelector('.js-stamp');if(st){const v=stat();st.textContent=v==='inperson'?x.inStamp:v==='ready'?x.pvReady:x.pvDraft;}};
  updatePV(el,FOC);
  bindFields(el,()=>{updatePV(el,FOC);setStamp();});
  el.querySelectorAll('.js-role').forEach(b=>b.onclick=()=>{R.role=b.dataset.k;delete R.err.role;r1(el);});
  el.querySelectorAll('.js-st').forEach(b=>b.onclick=()=>{s.step=+b.dataset.i;r1(el);});
  el.querySelector('.js-bk').onclick=()=>{s.step=Math.max(1,s.step-1);r1(el);};
  el.querySelector('.js-nx').onclick=()=>{
    if(s.step===1){if(!R.role){R.err.role=x.pickErr;r1(el);return;}s.step=2;}
    else if(cen){if(inP){go('home');return;}const e=validate(['file','consent']);R.err=e;if(!Object.keys(e).length){submitNow();return;}r1(el);focusBad(el);return;}
    else if(s.step===4){const e=validate(reqKeys(R.role));R.err=e;if(!Object.keys(e).length){submitNow();return;}
      const g2=G(R.role);s.step=g2.applicant.some(k=>e[k])?2:g2.org.some(k=>e[k])?3:4;r1(el);focusBad(el);return;}
    else{const e=validate(steps[s.step-1][1]);R.err=e;if(Object.keys(e).length){r1(el);focusBad(el);return;}s.step++;}
    s.max=Math.max(s.max,s.step);r1(el);window.scrollTo({top:0});
  };
}

/* ---------- 2 · accordion ---------- */
function groupsOf(r){if(r==='central')return [];const g=G(r);return [['gA',g.applicant],['gO',g.org],['gC',[...g.account,'consent']]];}
const PVMAP={prefix:'name',fname:'name',lname:'name',pos:'pos',email:'email',tel:'tel',school:'org',affil:'org',dept:'org',prov:'prov',uname:'uname'};
function pvKeysFor(k){if(k==='file')return R.role==='central'?['prov','org']:[];if(k==='method')return ['prov','org'];return PVMAP[k]?[PVMAP[k]]:[];}
const pvStat=()=>R.sent?'sent':isIn()?'inperson':(R.role&&reqKeys(R.role).every(filled)?'ready':'draft');
function refreshStamp(el){const x=RX[lang],st=el.querySelector('.js-stamp');if(!st)return;const v=pvStat();st.textContent=v==='sent'?x.pvSent:v==='inperson'?x.inStamp:v==='ready'?x.pvReady:x.pvDraft;st.classList.toggle('sent',v==='sent');}
function r2(el){
  const x=RX[lang],s=ST[2];
  const seg=`<div class="seg">${Object.keys(ROLES).map(k=>{const r=ROLES[k];return `<button type="button" class="js-role ${R.role===k?'on':''}" data-k="${k}"><span class="ri">${r.ic}</span><span><b>${r[lang]}</b><small>${lang==='th'?r.sth:r.sen}</small></span></button>`}).join('')}</div>`;
  let main='',bar='';
  if(!R.role){main=`<div class="empty2">${x.ph2}</div>`;}
  else{
    const gs=groupsOf(R.role);
    if(R.role==='central')main=`<div class="acc open" data-i="1"><button type="button" class="h js-ac"><span class="no">1</span><span class="t"><b>${x.gForm}</b><small class="cnt"></small></span><span class="ch"></span></button><div class="body">${centralBodyHTML()}</div></div>`;
    else main=gs.map(([n,keys],i)=>{const done=keys.filter(filled).length,ok=done===keys.length,hasErr=keys.some(k=>R.err[k]);const body=['applicant','org','account'][i];
      return `<div class="acc ${s.open[i+1]?'open':''} ${ok?'ok':''} ${hasErr?'hasErr':''}" data-i="${i+1}"><button type="button" class="h js-ac"><span class="no">${ok?'✓':i+1}</span><span class="t"><b>${x[n]}</b><small class="cnt">${done} ${x.of} ${keys.length} ${x.fields}</small></span><span class="ch"></span></button><div class="body">${groupHTML(body)}${i===2?consentHTML():''}</div></div>`;}).join('');
  }
  const all=R.role?reqKeys(R.role):[],dn=all.filter(filled).length,pct=all.length?Math.round(dn/all.length*100):0;
  const bar0=`<div class="bar2"><div class="pg"><small class="pgt">${x.prog} ${pct}% (${dn} ${x.of} ${all.length} ${x.fields})</small><div class="pbar"><i class="pgi" style="width:${pct}%"></i></div></div><button type="button" class="btn btn-p js-sub" ${R.role?'':'disabled'}>✓ ${x.submit}</button></div>`;
  bar=isIn()?`<div class="bar2"><div class="pg"><small>${x.inBar}</small></div><button type="button" class="btn btn-o js-home">${x.homeBtn}</button></div>`:bar0;
  let foc=[];
  el.innerHTML=`<div class="r2"><h2>${x.title}</h2><p class="sub">${x.sub}</p><div class="r2g">${pvHTML(pvStat())}<div class="r2m">${seg}${main}${bar}</div></div></div>`;
  updatePV(el,foc);
  const upd=(k)=>{if(typeof k==='string')foc=pvKeysFor(k);updatePV(el,foc);refreshStamp(el);if(!R.role)return;const gs=groupsOf(R.role);el.querySelectorAll('.acc').forEach((a,i)=>{if(!gs[i])return;const keys=gs[i][1],done=keys.filter(filled).length,ok=done===keys.length;a.classList.toggle('ok',ok);a.querySelector('.no').textContent=ok?'✓':i+1;a.querySelector('.cnt').textContent=`${done} ${x.of} ${keys.length} ${x.fields}`;});
    const all=reqKeys(R.role),dn=all.filter(filled).length,pct=all.length?Math.round(dn/all.length*100):0;if(!el.querySelector('.pgt'))return;el.querySelector('.pgt').textContent=`${x.prog} ${pct}% (${dn} ${x.of} ${all.length} ${x.fields})`;el.querySelector('.pgi').style.width=pct+'%';};
  bindFields(el,upd);
  el.querySelector('.r2m').addEventListener('focusin',e=>{const fl=e.target.closest&&e.target.closest('.fld[data-k]');if(fl){foc=pvKeysFor(fl.dataset.k);updatePV(el,foc);}});
  el.querySelectorAll('.js-role').forEach(b=>b.onclick=()=>{R.role=b.dataset.k;R.err={};r2(el);});
  el.querySelectorAll('.js-ac').forEach(b=>b.onclick=()=>{const a=b.closest('.acc'),i=+a.dataset.i;s.open[i]=!a.classList.contains('open');a.classList.toggle('open',s.open[i]);});
  const sb=el.querySelector('.js-sub');
  if(sb)sb.onclick=()=>{const e=validate(reqKeys(R.role));R.err=e;if(!Object.keys(e).length){submitNow();return;}
    groupsOf(R.role).forEach(([n,keys],i)=>{if(keys.some(k=>e[k]))s.open[i+1]=true;});r2(el);focusBad(el);};
}

/* ---------- 5 · live preview ---------- */
function pvHTML(status='draft'){const x=RX[lang],st={draft:[x.pvDraft,''],ready:[x.pvReady,''],sent:[x.pvSent,'sent'],inperson:[x.inStamp,'']}[status];return `<aside class="pv"><div class="pvh"><small>${x.pvT.toUpperCase()}</small><b>${x.title}</b><span class="stamp js-stamp ${st[1]}">${st[0]}</span></div>
  <div class="av"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="38" r="17" fill="var(--m)" opacity=".85"/><path d="M14 100c0-22 16-36 36-36s36 14 36 36z" fill="var(--m)" opacity=".85"/></svg></div>
  <div class="pvb"><div class="nm" data-pv="name"></div><div class="ps" data-pv="pos"></div>
   <dl><div><dt>${x.f.fname?x.role:''}</dt><dd data-pv="role"></dd></div><div><dt data-pvl="org">${x.pvOrg}</dt><dd data-pv="org"></dd></div><div><dt data-pvl="prov">${x.pvProv}</dt><dd data-pv="prov"></dd></div><div><dt>${x.pvMail}</dt><dd data-pv="email"></dd></div><div><dt>${x.pvTel}</dt><dd data-pv="tel"></dd></div><div><dt>${x.pvUser}</dt><dd data-pv="uname"></dd></div></dl></div></aside>`;}
function updatePV(el,focus=[]){
  const x=RX[lang],d=R.d,r=R.role?ROLES[R.role]:null,px=x.prefixes[d.prefix]||'',cen=R.role==='central';
  const val={name:cen?r[lang]:`${px} ${d.fname} ${d.lname}`.trim(),pos:cen?x.gForm:d.pos,role:r?r.ic+' '+r[lang]:'',
    org:R.role==='school'?d.school:R.role==='province'?(x.affils[d.affil]||''):cen?(d.method==='file'?d.file:''):'',
    prov:cen?(d.method==='inperson'?x.pvFormIn:(d.file?x.pvFormFile:'')):d.prov,email:d.email,tel:d.tel,uname:d.uname};
  const setL=(k,t)=>{const l=el.querySelector('[data-pvl="'+k+'"]');if(l)l.textContent=t;};
  setL('prov',cen?x.pvForm:x.pvProv);setL('org',cen?x.pvFile:x.pvOrg);
  const rowOf=k=>{const n=el.querySelector('[data-pv="'+k+'"]');return n?n.closest('dl div'):null;};
  ['email','tel','uname'].forEach(k=>{const rw=rowOf(k);if(rw)rw.style.display=cen?'none':'';});
  const orw=rowOf('org');if(orw)orw.style.display=(cen&&d.method==='inperson')?'none':'';
  const ph={name:x.pvName,pos:x.pvPos,role:x.role,org:cen?'—':x.pvOrg,prov:cen?'—':x.pvProv,email:'name@example.com',tel:'08xxxxxxxx',uname:'username'};
  el.querySelectorAll('[data-pv]').forEach(n=>{const k=n.dataset.pv,v=val[k];n.textContent=v||ph[k];n.classList.toggle('ghost',!v);(n.closest('dl div')||n).classList.toggle('hl',focus.includes(k));});
}

let rlay='1';
function renderInto(root){
  const dm=root.querySelector('.js-demo');if(!dm)return;
  dm.classList.add('rgd');
  dm.innerHTML='<div class="rg"><div class="rw js-rr"></div></div>';
  const el=dm.querySelector('.js-rr');
  (rlay==='2'?r2:r1)(el);
}
function renderAll(){
  if(page==='register')document.querySelectorAll('.variant').forEach(renderInto);
  if(modalEl().classList.contains('on'))renderModal();
}
document.addEventListener('keydown',e=>{
  if(!modalEl().classList.contains('on')||e.key!=='Tab')return;
  const bs=[...modalEl().querySelectorAll('button')],i=bs.indexOf(document.activeElement);
  e.preventDefault();bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus();
});
return {render:renderInto,renderAll,fill:fillDemo,reset:resetAll,get lay(){return rlay},set lay(v){rlay=v==='2'?'2':'1';}};

})();

function go(id){if(id==='forgot'&&page!=='forgot')S.forgot={v:'',err:'',sent:false};page=id;window.scrollTo({top:0});document.querySelectorAll('.variant').forEach(r=>{closeAll(r);r.classList.remove('nv-open')});renderAll();syncRG();}
function closePops(){document.querySelectorAll('.pop-menu.open').forEach(m=>m.classList.remove('open'))}
document.querySelectorAll('.variant').forEach(root=>{
  root.querySelectorAll('.js-lang').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=b.parentNode.querySelector('.js-lang-menu');const o=!m.classList.contains('open');closePops();if(o)m.classList.add('open')});
  root.querySelectorAll('.js-fs-down').forEach(b=>b.onclick=e=>{e.stopPropagation();fs=Math.max(13,fs-1);applyFs()});
  root.querySelectorAll('.js-fs-up').forEach(b=>b.onclick=e=>{e.stopPropagation();fs=Math.min(22,fs+1);applyFs()});
  root.querySelectorAll('.js-home').forEach(a=>a.onclick=e=>{e.preventDefault();go('home')});
  root.querySelector('.js-burger').onclick=e=>{e.stopPropagation();root.classList.toggle('nv-open')};
});
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'px');
  document.querySelectorAll('.js-fs-down').forEach(b=>b.disabled=fs<=13);document.querySelectorAll('.js-fs-up').forEach(b=>b.disabled=fs>=22);save();}
document.addEventListener('click',()=>{closePops();document.querySelectorAll('.variant').forEach(closeAll)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePops();document.querySelectorAll('.variant').forEach(closeAll)}});

function syncRG(){
  const on=page==='register';
  document.getElementById('rgTools').style.display=on?'inline-flex':'none';
  document.getElementById('rgGo').classList.toggle('on',on);
  document.querySelectorAll('#switch [data-rlay]').forEach(b=>b.classList.toggle('on',b.dataset.rlay===RG.lay));
}
function show(){
  stage.classList.toggle('all',all);
  document.querySelectorAll('.variant').forEach(s=>s.classList.toggle('on',all||(s.dataset.layout===layout&&s.dataset.color===color)));
  document.querySelectorAll('[data-layout]').forEach(b=>{if(b.tagName==='BUTTON')b.classList.toggle('on',!all&&b.dataset.layout===layout)});
  document.querySelectorAll('[data-color]').forEach(b=>{if(b.tagName==='BUTTON')b.classList.toggle('on',!all&&b.dataset.color===color)});
  document.getElementById('allBtn').classList.toggle('on',all);
  document.getElementById('desc').textContent=all?'แสดงทั้ง 15 แบบเรียงกัน (ซ่อนพื้นที่เนื้อหาเพื่อให้เทียบ header ง่าย) — กดเลือกแบบหรือสีเพื่อกลับไปดูทีละแบบ':`${layout} · ${LAYOUTS[layout]} — สี${COLORS[color].th}: ${layout==='D'?PAIR_D[color]:COLORS[color].pair}`;
  syncRG();if(page==='register')RG.renderAll();
  save();
}
document.querySelectorAll('#switch [data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;all=false;show()});
document.querySelectorAll('#switch [data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;all=false;show()});
document.getElementById('allBtn').onclick=()=>{all=!all;show()};
document.getElementById('rgGo').onclick=()=>go('register');
document.querySelectorAll('#switch [data-rlay]').forEach(b=>b.onclick=()=>{RG.lay=b.dataset.rlay;syncRG();RG.renderAll();save();});
document.getElementById('rgFill').onclick=()=>RG.fill();
document.getElementById('rgReset').onclick=()=>RG.reset();
addEventListener('resize',()=>document.querySelectorAll('.variant').forEach(buildNav));
function save(){try{localStorage.setItem('opec-hdr12',JSON.stringify({lang,fs,layout,color,all,rlay:RG.lay}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('opec-hdr12')||'{}');if(s.lang)lang=s.lang;if(s.fs)fs=s.fs;if(LAYOUTS[s.layout])layout=s.layout;if(COLORS[s.color])color=s.color;all=!!s.all;if(s.rlay)RG.lay=s.rlay}catch(e){}
renderAll();applyFs();show();
</script>
