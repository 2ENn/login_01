<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบ Single Sign-On — ต้นแบบหน้าจอ (Prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="switch" id="switch">
  <span class="lbl">แบบ</span>
  <button data-layout="A">A · Royal Heritage</button>
  <button data-layout="D">D · Split Diagonal</button>
  <button data-layout="E">E · Golden Crest</button>
  <span class="sep"></span>
  <span class="lbl">สี</span>
  <button data-color="blue"><i class="sw" style="background:#0b2a5b"></i>น้ำเงิน</button>
  <button data-color="red"><i class="sw" style="background:#8f0000"></i>แดง</button>
  <button data-color="orange"><i class="sw" style="background:#b93d0a"></i>ส้ม</button>
  <button data-color="green"><i class="sw" style="background:#0f5132"></i>เขียว</button>
  <button data-color="brown"><i class="sw" style="background:#5b3a29"></i>น้ำตาล</button>
  <span class="sep"></span>
  <button id="allBtn">ดูทั้งหมด 15 แบบ</button>
  <span class="sep"></span>
  <button id="rgGo">ไปหน้าลงทะเบียน</button>
  <span id="rgTools" style="display:none;align-items:center;gap:8px;flex-wrap:wrap">
    <span class="lbl">ฟอร์มลงทะเบียน</span>
    <button data-rlay="1">1 · ใบสมัคร + Stepper</button>
    <button data-rlay="2">2 · Accordion</button>
    <button id="rgFill" class="act">เติมข้อมูลตัวอย่าง</button>
    <button id="rgReset" class="act">ล้างฟอร์ม</button>
  </span>
  <div class="desc" id="desc"></div>
</div>

<div class="stage" id="stage">

<template id="tpl-A">
<section class="variant vA">
  <div class="vlabel"></div>
  <div class="bar">
    <a class="logo js-home" href="#"><img data-logo alt=""></a>
    <div class="ttl"><h1 data-i18n="org"></h1><p data-i18n="sys"></p></div>
    <div class="tools">
      <div class="pop"><button class="chip js-lang">🌐 <span data-i18n="lang"></span></button><div class="pop-menu js-lang-menu"></div></div>
      <span class="chip fs"><span data-i18n="font"></span><button class="pm js-fs-down">−</button><b data-i18n="ko"></b><button class="pm js-fs-up">+</button></span>
    </div>
    <button class="burger js-burger" aria-label="menu">☰</button>
  </div>
  <nav><ul class="nv js-nav"></ul></nav>
  <main class="demo js-demo"></main>
  <footer class="ft js-foot"></footer>
</section>
</template>

<template id="tpl-D">
<section class="variant vD">
  <div class="vlabel"></div>
  <div class="bar">
    <div class="left">
      <a class="logo js-home" href="#"><img data-logo alt=""></a>
      <div class="ttl"><h1 data-i18n="org"></h1><p data-i18n="sys"></p></div>
      <button class="burger js-burger" aria-label="menu">☰</button>
    </div>
    <div class="right">
      <div class="util">
        <div class="pop"><button class="lk js-lang"><span data-i18n="lang"></span> ▾</button><div class="pop-menu js-lang-menu"></div></div>
        <span class="fs"><span data-i18n="font"></span><button class="pm js-fs-down">−</button><b data-i18n="ko"></b><button class="pm js-fs-up">+</button></span>
      </div>
      <ul class="nv js-nav"></ul>
    </div>
  </div>
  <div class="strip"></div>
  <main class="demo js-demo"></main>
  <footer class="ft js-foot"></footer>
</section>
</template>

<template id="tpl-E">
<section class="variant vE">
  <div class="vlabel"></div>
  <div class="bar">
    <div class="tools">
      <div class="pop"><button class="lk js-lang"><span data-i18n="lang"></span> ▾</button><div class="pop-menu js-lang-menu"></div></div>
      <span class="fs"><span data-i18n="font"></span><button class="pm js-fs-down">−</button><b data-i18n="ko"></b><button class="pm js-fs-up">+</button></span>
    </div>
    <div class="crest"><a class="logo js-home" href="#"><img data-logo alt=""></a></div>
    <div class="ttl"><h1 data-i18n="org"></h1><p data-i18n="sys"></p></div>
    <button class="burger js-burger" aria-label="menu">☰</button>
  </div>
  <nav><ul class="nv js-nav"></ul></nav>
  <main class="demo js-demo"></main>
  <footer class="ft js-foot"></footer>
</section>
</template>

</div>

<script src="app.js"></script>
<datalist id="schools-list"><option value="โรงเรียนอัสสัมชัญ"><option value="โรงเรียนเซนต์คาเบรียล"><option value="โรงเรียนกรุงเทพคริสเตียนวิทยาลัย"><option value="โรงเรียนวัฒนาวิทยาลัย"><option value="โรงเรียนมาแตร์เดอีวิทยาลัย"><option value="โรงเรียนเซนต์ยอแซฟคอนเวนต์"><option value="โรงเรียนดาราวิทยาลัย"><option value="โรงเรียนมงฟอร์ตวิทยาลัย"></datalist>
<div class="rg"><div class="modal" id="rgmodal" role="dialog" aria-modal="true"><div class="mbox"></div></div></div>
<div class="toast" id="toast"></div>
</body>
</html>
